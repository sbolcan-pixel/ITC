<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignment #1 - Conversion | CS 1130</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap"><a class="back" href="index.html">&larr; Back to home</a>
<div class="card"><h2>Assignment #1 - Conversion</h2><p class="sub">Temperature and length conversions.</p>

<h3>Celsius to Fahrenheit</h3>
<div class="row"><label>Celsius (°C)<input id="c2f" type="number" step="any"></label><button class="go" onclick="convert('c2f',v=>v*9/5+32,'°F')">Convert</button></div><div class="out" id="c2f-out"></div>
<h3>Fahrenheit to Celsius</h3>
<div class="row"><label>Fahrenheit (°F)<input id="f2c" type="number" step="any"></label><button class="go" onclick="convert('f2c',v=>(v-32)*5/9,'°C')">Convert</button></div><div class="out" id="f2c-out"></div>
<h3>Meters to Feet</h3>
<div class="row"><label>Meters (m)<input id="m2f" type="number" step="any"></label><button class="go" onclick="convert('m2f',v=>v*3.28084,'ft')">Convert</button></div><div class="out" id="m2f-out"></div>
<h3>Feet to Meters</h3>
<div class="row"><label>Feet (ft)<input id="f2m" type="number" step="any"></label><button class="go" onclick="convert('f2m',v=>v/3.28084,'m')">Convert</button></div><div class="out" id="f2m-out"></div>
</div></div><script src="common.js"></script>
<script>
function convert(id,fn,unit){
  const raw=$(id).value;
  if(raw===""||isNaN(raw)) return show(id+"-out","Enter a number to convert.",true);
  show(id+"-out",`${raw} = <strong>${fn(parseFloat(raw)).toFixed(2)} ${unit}</strong>`);
}
</script></body></html>
