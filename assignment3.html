<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignment #3 - Factorial, Sum and Average | CS 1130</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap"><a class="back" href="index.html">&larr; Back to home</a>
<div class="card"><h2>Assignment #3 - Factorial, Sum and Average</h2><p class="sub">Loops on the first N natural numbers. Enter a whole number N of 1 or more.</p>

<div class="row"><label>N<input id="n" type="number" min="1" step="1"></label></div>
<h3>Factorial (while loop)</h3>
<div class="row"><button class="go" onclick="doFactorial()">Compute factorial</button></div><div class="out" id="fact-out"></div>
<h3>Sum (do-while loop)</h3>
<div class="row"><button class="go" onclick="doSum()">Compute sum</button></div><div class="out" id="sum-out"></div>
<h3>Average (for loop)</h3>
<div class="row"><button class="go" onclick="doAvg()">Compute average</button></div><div class="out" id="avg-out"></div>
</div></div><script src="common.js"></script>
<script>
function getN(outId){
  const n=Number($("n").value);
  if(!Number.isInteger(n)||n<1){show(outId,"Enter a whole number of 1 or more.",true);return null}
  return n;
}
function doFactorial(){
  const n=getN("fact-out"); if(n===null) return;
  if(n>1000) return show("fact-out","Use N of 1000 or less for factorial.",true);
  let i=1, f=1n;
  while(i<=n){ f*=BigInt(i); i++; }
  const s=f.toString();
  show("fact-out",`${n}! = <strong>${s.length>60?s.slice(0,30)+"… ("+s.length+" digits)":s}</strong>`);
}
function doSum(){
  const n=getN("sum-out"); if(n===null) return;
  let i=1, sum=0;
  do { sum+=i; i++; } while(i<=n);
  show("sum-out",`1 + 2 + … + ${n} = <strong>${sum.toLocaleString()}</strong>`);
}
function doAvg(){
  const n=getN("avg-out"); if(n===null) return;
  let total=0;
  for(let i=1;i<=n;i++){ total+=i; }
  show("avg-out",`Average of 1 to ${n} = <strong>${(total/n).toLocaleString(undefined,{maximumFractionDigits:2})}</strong>`);
}
</script></body></html>
